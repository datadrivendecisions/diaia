name: Publish handbook

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Only site/ is ever published. work/ stays in the repo, never on the site.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check site links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on relative links that point outside site/
        run: |
          fail=0
          while IFS= read -r page; do
            grep -oE '(href|src)="[^"]*"' "$page" \
              | sed -E 's/^(href|src)="//; s/"$//' \
              | grep -vE '^(https?:|mailto:|data:|#|//)' \
              | sed -E 's/[#?].*$//' \
              | grep -v '^$' \
              | sort -u \
              | while IFS= read -r target; do
                  if [ ! -e "site/$target" ]; then
                    echo "::error file=$page::broken link -> $target (not found in site/)"
                    exit 1
                  fi
                done || fail=1
          done < <(find site -name '*.html')
          exit $fail

      - name: Upload site preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
